services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: csv-job-platform-app:latest
    container_name: csv-job-platform-api
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: csv-job-platform
      APP_ENV: docker
      APP_DEBUG: "false"
      API_PREFIX: /api
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/csv_job_platform
      JWT_SECRET_KEY: change-me-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_BYTES: 5242880
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    container_name: csv-job-platform-postgres
    environment:
      POSTGRES_DB: csv_job_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d csv_job_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: csv-job-platform-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  worker:
    image: csv-job-platform-app:latest
    container_name: csv-job-platform-worker
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      APP_NAME: csv-job-platform
      APP_ENV: docker
      APP_DEBUG: "false"
      API_PREFIX: /api
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/csv_job_platform
      JWT_SECRET_KEY: change-me-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_BYTES: 5242880
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
